[package]
name = "rpc-auth-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rpc-auth-proxy"
path = "src/main.rs"

[dependencies]
alloy = { version = "1.0", default-features = false, features = ["std", "consensus", "eips", "k256", "rpc-types", "serde"] }
alloy-network-primitives = "1.0"
alloy-rpc-types = "1.0"
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
config = "0.15"
dashmap = "6.1"
futures-util = "0.3"
headers = "0.4"
http = "1.3"
hyper = "1.7"
jsonrpsee = { version = "0.26", features = ["full"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
moka = { version = "0.12", features = ["future"] }
rand = "0.9"
scroll-alloy-rpc-types = { git = "https://github.com/scroll-tech/reth", rev = "d485f4718a0c93f3fc1ec453b8ddde6ce1ebe397" }
serde = { version = "1.0", features = ["derive"] }
siwe = "0.6"
tokio = { version = "1.47", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["auth", "cors", "request-id", "sensitive-headers", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
alloy = { version = "1.0", default-features = false, features = ["signer-local"] }
